[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-recovery"
version = "0.1.0"
description = "Predict tACS post-treatment FMA-UE proportional recovery from baseline EEG and clinical features."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "openpyxl",
  "pandas",
  "pyyaml",
  "scipy",
  "scikit-learn",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
